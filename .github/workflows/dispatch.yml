name: RSS Discord Notifier (external trigger only)

# 重要: ここに `schedule:` は書かない。
# 起動は必ず cron-job.org からの repository_dispatch (外部HTTPリクエスト) のみで行う。
on:
  repository_dispatch:
    types: [run-notify, init-read, test-notify, system-test]
  # 手動デバッグ用（cron-job.orgを介さずGitHubのUIから直接試したい時だけ使う。定期実行には使わない）
  workflow_dispatch:
    inputs:
      mode:
        description: "run-notify / init-read / test-notify / system-test のいずれか"
        required: true
        default: "run-notify"
        type: choice
        options:
          - run-notify
          - init-read
          - test-notify
          - system-test

permissions:
  contents: write  # state/*.json を自動コミットするために必要

# 同時実行を禁止する。
# cron-job.org の定期起動と手動実行(workflow_dispatch)が重なると、2つのジョブが
# 同じ state/*.json を読んでから書き戻すため、
#   - 両方が同じ記事を「未読」と判定して二重通知する
#   - 後から終わった方の push が non-fast-forward で失敗し、既読記録が丸ごと失われる
# という事故が起きる。cancel-in-progress は false にして、走っている方は必ず
# 最後まで終わらせ(=通知済みの記事を確実に既読化させ)、後続を待たせる。
concurrency:
  group: rss-notifier-state
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存関係をインストール
        run: pip install -r requirements.txt

      - name: 実行モードを決定
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "mode=${{ github.event.action }}" >> "$GITHUB_OUTPUT"
          else
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          fi

      - name: run-notify を実行（通常の差分通知）
        if: steps.mode.outputs.mode == 'run-notify'
        env:
          # フィードを追加した場合はここに DISCORD_WEBHOOK_URL_<新ID> を1行追加してください。
          # (feeds.json の webhook_env に書いた名前と、ここの env の名前を一致させる)
          DISCORD_WEBHOOK_URL_DAITO: ${{ secrets.DISCORD_WEBHOOK_URL_DAITO }}
          DISCORD_WEBHOOK_URL_SAIGAI: ${{ secrets.DISCORD_WEBHOOK_URL_SAIGAI }}
          DISCORD_WEBHOOK_URL_SYSTEM: ${{ secrets.DISCORD_WEBHOOK_URL_SYSTEM }}
        run: python main.py

      - name: init-read を実行（初回全既読化・通知なし）
        if: steps.mode.outputs.mode == 'init-read'
        env:
          DISCORD_WEBHOOK_URL_DAITO: ${{ secrets.DISCORD_WEBHOOK_URL_DAITO }}
          DISCORD_WEBHOOK_URL_SAIGAI: ${{ secrets.DISCORD_WEBHOOK_URL_SAIGAI }}
          DISCORD_WEBHOOK_URL_SYSTEM: ${{ secrets.DISCORD_WEBHOOK_URL_SYSTEM }}
        run: python init_read.py

      - name: test-notify を実行（先頭1件だけテスト通知）
        if: steps.mode.outputs.mode == 'test-notify'
        env:
          DISCORD_WEBHOOK_URL_DAITO: ${{ secrets.DISCORD_WEBHOOK_URL_DAITO }}
          DISCORD_WEBHOOK_URL_SAIGAI: ${{ secrets.DISCORD_WEBHOOK_URL_SAIGAI }}
          DISCORD_WEBHOOK_URL_SYSTEM: ${{ secrets.DISCORD_WEBHOOK_URL_SYSTEM }}
        run: python test_notify.py

      - name: system-test を実行（システム通知チャンネルへの疎通確認）
        if: steps.mode.outputs.mode == 'system-test'
        env:
          DISCORD_WEBHOOK_URL_SYSTEM: ${{ secrets.DISCORD_WEBHOOK_URL_SYSTEM }}
        run: python test_system_notify.py

      - name: 状態ファイル(state/*.json)の変更を確認
        id: diff
        # 必ず実行する。通知ステップが失敗しても、そこまでに送信できた分の既読記録は
        # コミットしないと次回に二重通知される。
        if: "!cancelled()"
        run: |
          git config user.name "rss-notifier-bot"
          git config user.email "actions@users.noreply.github.com"
          # git diff は「追跡済みファイルの変更」しか見ないため、feeds.json にフィードを
          # 追加した直後の state/read_<新ID>.json のような**新規ファイル**を見落とす。
          # 見落とすと既読記録が永久にコミットされず、毎時まるごと再通知され続ける。
          # git status --porcelain なら未追跡ファイルも検出できる。
          if [ -z "$(git status --porcelain -- state/)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 状態ファイルをコミット&プッシュ
        if: "!cancelled() && steps.diff.outputs.changed == 'true'"
        run: |
          git add -A state/
          git commit -m "chore: update state via ${{ steps.mode.outputs.mode }} [skip ci]"
          # push が他のコミットと競合することがある(state以外の変更がpushされた直後など)。
          # ここで諦めると既読記録が失われ、次回に同じ記事が丸ごと再通知されるため、
          # rebase して数回リトライする。
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "push 成功 (${attempt}回目)"
              exit 0
            fi
            echo "push に失敗しました (${attempt}回目)。rebase して再試行します..."
            sleep $((attempt * 3))
            # このステップは bash -e で実行されるため、rebase の失敗でスクリプト全体が
            # 止まらないよう明示的に受け止める(中断したrebaseは片付けて次の試行に進む)。
            if ! git pull --rebase --autostash origin "${{ github.ref_name }}"; then
              echo "rebase に失敗しました。中断して再試行します。"
              git rebase --abort || true
            fi
          done
          echo "::error::state/*.json の push に5回失敗しました。既読記録が保存されていないため、次回の実行で記事が重複通知される可能性があります。"
          exit 1
